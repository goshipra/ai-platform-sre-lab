apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: rag-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      serviceAccountName: rag-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: ingest
          image: ghcr.io/goshipra/rag-mlops-pipeline:bootstrap
          command: [python, ingest.py]
          envFrom:
            - configMapRef:
                name: rag-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      containers:
        - name: rag-service
          image: ghcr.io/goshipra/rag-mlops-pipeline:bootstrap
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: rag-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: rag-platform
spec:
  type: NodePort
  selector:
    app: rag-service
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080

